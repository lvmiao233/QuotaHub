[project]
name = "quota-hub"
version = "0.3.0"
description = "QuotaHub — coding plan quota viewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
quota-hub = "app.main:run"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
